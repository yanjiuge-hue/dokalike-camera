name: dokalike_camera
description: 极简轻量无广告的 AI 相机 App（原创实现，不含任何第三方品牌素材）。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 相机预览 / 拍照 / 帧流
  camera: ^0.11.0+2
  # 状态管理 + 依赖注入
  flutter_riverpod: ^2.5.1
  # TFLite FFI 推理（可在后台 Isolate 中运行）
  tflite_flutter: ^0.11.0
  # 人脸检测（原生线程推理）
  google_mlkit_face_detection: ^0.13.0
  # 落盘滤镜 / 美颜 / 缩略图（纯 Dart 图像处理）
  image: ^4.2.0
  # 本地存储（不使用代码生成，只存 Map）
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 权限
  permission_handler: ^11.3.1
  # 路径
  path_provider: ^2.1.3
  path: ^1.9.0
  # 写入系统相册（轻量平台通道封装）
  gal: ^2.3.0
  # 系统分享面板
  share_plus: ^10.0.0
  # 水平仪（加速度计横滚角）
  sensors_plus: ^6.0.1
  # 值对象相等
  equatable: ^2.0.5
  # 日期格式化（相册分组 / l10n 预留）
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # QA 单元测试 mock
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/luts/

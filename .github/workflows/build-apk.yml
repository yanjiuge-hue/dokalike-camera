name: 构建 Android APK

# 触发条件：推送到 main/master 分支、打 v* 开头的 tag、或手动触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'   # pubspec 要求 sdk>=3.3.0；3.24 稳定且兼容
  JAVA_VERSION: '17'           # build.gradle 要求 VERSION_17

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # 1) 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 安装 JDK 17（Gradle 8 + Android Gradle Plugin 8 要求）
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 3) 安装 Flutter SDK
      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 4) 补齐 flutter create 生成的平台脚手架（MainActivity / Gradle wrapper / res 等）
      #    已有文件（lib/ pubspec.yaml android/app/build.gradle 等）不会被覆盖。
      - name: 补齐 Flutter 工程脚手架
        run: flutter create --org com.dokalike --project-name dokalike_camera .

      # 5) 拉取 Dart 依赖
      - name: 拉取依赖
        run: flutter pub get

      # 6) 静态分析（不阻塞构建，仅报告）
      - name: 静态分析（不阻塞）
        run: flutter analyze || true

      # 7) 运行单元测试（不阻塞 release 产出，失败仅告警）
      - name: 单元测试（不阻塞）
        run: flutter test || true

      # 8) 构建 Release APK（split-per-abi 已在 build.gradle 开启，会产出 3 个 APK）
      - name: 构建 Release APK
        run: flutter build apk --release

      # 9) 上传所有 APK 作为构建产物
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dokalike-camera-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # 10) 输出构建摘要
      - name: 构建摘要
        run: |
          echo "## DokaLike Camera APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print "- **"$NF"**  "$5}'
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装说明" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 artifact `dokalike-camera-apk`" >> $GITHUB_STEP_SUMMARY
          echo "2. 解压后选择对应架构的 APK（多数手机用 **app-arm64-v8a-release.apk**）" >> $GITHUB_STEP_SUMMARY
          echo "3. 手机开启「未知来源应用安装」后点击安装" >> $GITHUB_STEP_SUMMARY

name: 构建 Android APK

# 触发条件：推送到 main/master 分支、打 v* 开头的 tag、或手动触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# 需要写权限：构建日志会被推送到独立的 ci-logs 分支，便于远程排错
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'   # pubspec 要求 sdk>=3.3.0；3.24 稳定且兼容
  JAVA_VERSION: '17'           # build.gradle 要求 VERSION_17
  ORG: 'com.dokalike'
  PROJECT: 'dokalike_camera'
  LOG_DIR: 'ci-logs'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # 1) 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 环境诊断：把 Java / Android SDK / Gradle 环境写进日志，
      #    方便远程定位「SDK 版本缺失」「AGP 版本不匹配」一类问题。
      - name: 环境诊断
        run: |
          mkdir -p "${LOG_DIR}"
          {
            echo "===== RUN INFO ====="
            echo "repository : ${GITHUB_REPOSITORY}"
            echo "run_id     : ${GITHUB_RUN_ID}"
            echo "attempt    : ${GITHUB_RUN_ATTEMPT}"
            echo "commit     : ${GITHUB_SHA}"
            echo "ref        : ${GITHUB_REF}"
            echo "===== JAVA ====="
            java -version 2>&1 || true
            echo "===== ANDROID SDK ====="
            echo "ANDROID_HOME     = $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "SDK dir          = $SDK"
            echo "-- installed platforms --"
            ls -1 "$SDK/platforms" 2>/dev/null || echo "(platforms 目录不存在)"
            echo "-- installed build-tools --"
            ls -1 "$SDK/build-tools" 2>/dev/null || echo "(build-tools 目录不存在)"
            echo "===== 磁盘空间 ====="
            df -h / | tail -n 1 || true
          } 2>&1 | tee "${LOG_DIR}/01-env.log"

      # 3) 安装 JDK 17（Gradle 8 + Android Gradle Plugin 8 要求）
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 4) 安装 Flutter SDK
      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 4.5) 补齐可能缺失的 Android SDK 平台。
      #      部分插件（如 google_mlkit_face_detection）声明了 compileSdk 35，
      #      若 runner 上没装对应的 SDK Platform，Gradle 配置阶段会直接失败。
      - name: 补齐 Android SDK 平台
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          {
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "SDK dir = $SDK"
            if command -v sdkmanager >/dev/null 2>&1; then
              yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
              yes 2>/dev/null | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
              yes 2>/dev/null | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
            else
              echo "sdkmanager 不在 PATH 中，跳过"
            fi
            echo "-- 补齐后的 platforms --"
            ls -1 "$SDK/platforms" 2>/dev/null || true
            echo "-- 补齐后的 build-tools --"
            ls -1 "$SDK/build-tools" 2>/dev/null || true

            echo "-- android.jar 完整性（aapt2 报 'Failed to load resources table' 时先看这里）--"
            for p in 33 34 35 36; do
              jar="$SDK/platforms/android-$p/android.jar"
              if [ -f "$jar" ]; then
                echo "  android-$p: $(stat -c '%s bytes' "$jar")"
                # unzip -t 会校验每个条目的 CRC；只要有一个坏条目就说明 jar 不完整
                unzip -t "$jar" 2>&1 | tail -n 2 | sed 's/^/    /'
              else
                echo "  android-$p: 未安装"
              fi
            done
          } 2>&1 | tee "${LOG_DIR}/02-sdk.log"

      # 5) ★关键★ 重建完整平台脚手架
      #
      # 背景：本仓库只提交了「自定义过的」平台配置（build.gradle /
      # AndroidManifest / proguard-rules / Podfile / Info.plist），
      # 未提交 flutter create 生成的脚手架（MainActivity.kt、Gradle wrapper、
      # settings.gradle、res 资源、xcodeproj 等）。
      #
      # 问题：flutter create 一旦检测到 android/ 目录已存在，就认为该平台
      # 「已配置」而**跳过整个 Android 模板拷贝**，导致上述脚手架永远缺失
      # → Gradle 找不到 settings.gradle / MainActivity → 构建失败。
      #
      # 解法：备份自定义配置 → 删除 android/ ios/ → 让 flutter create
      # 完整生成脚手架 → 再把自定义配置拷回去覆盖。
      - name: 重建平台脚手架
        run: |
          set -e
          mkdir -p "${LOG_DIR}"
          echo ">>> 备份自定义平台配置"
          mkdir -p /tmp/custom/android/app/src/main /tmp/custom/android/app/src/debug /tmp/custom/ios/Runner
          cp android/app/build.gradle                   /tmp/custom/android/app/build.gradle
          cp android/app/proguard-rules.pro             /tmp/custom/android/app/proguard-rules.pro
          cp android/app/src/main/AndroidManifest.xml   /tmp/custom/android/app/src/main/AndroidManifest.xml
          cp android/app/src/debug/AndroidManifest.xml  /tmp/custom/android/app/src/debug/AndroidManifest.xml
          cp ios/Podfile                                /tmp/custom/ios/Podfile
          cp ios/Runner/Info.plist                      /tmp/custom/ios/Runner/Info.plist

          echo ">>> 删除不完整的平台目录（让 flutter create 完整生成）"
          rm -rf android ios

          echo ">>> 生成完整脚手架"
          flutter create \
            --org "${ORG}" \
            --project-name "${PROJECT}" \
            --android-language kotlin \
            --ios-language swift \
            --platforms android,ios \
            .

          echo ">>> 清理由 flutter create 重新生成的模板残留"
          # flutter create 会补齐所有「模板里有、仓库里没有」的文件，其中就包括
          # 模板自带的 test/widget_test.dart —— 它引用模板计数器 App 的 MyApp
          # 组件，本项目里根本不存在，于是 analyze 报 creation_with_non_type、
          # flutter test 报 Failed to load，白白占用报错面板、掩盖真实问题。
          # 本项目有自己的 test/ 套件，这个文件没有任何价值，直接删掉。
          # （本地仓库并未跟踪该文件，所以只能在这里删；删了以后下次构建
          #   flutter create 还会再生成，因此每次都删。）
          if [ -f test/widget_test.dart ]; then
            grep -n "MyApp" test/widget_test.dart >/dev/null 2>&1 && echo "  删除模板残留 test/widget_test.dart（引用了 MyApp）" || echo "  删除 test/widget_test.dart"
            rm -f test/widget_test.dart
          else
            echo "  未发现 test/widget_test.dart，无需清理"
          fi

          echo ">>> 升级 Kotlin Gradle 插件版本（1.7.10 → 1.8.22）"
          # 背景：Flutter 3.24 模板生成的 settings.gradle 固定 Kotlin 1.7.10，
          # 而 camera / mlkit 等插件引入的 androidx 库（lifecycle 2.7.0、
          # core-ktx 1.13.1、fragment 1.7.1 等）是用 Kotlin 1.8 编译的，
          # 其 .kotlin_module 元数据版本为 1.8.0。Kotlin 1.7.x 的编译器
          # 读不了 1.8.0 元数据，编译期报：
          #   "Module was compiled with an incompatible version of Kotlin.
          #    The binary version of its metadata is 1.8.0, expected version is 1.6.0"
          # 这是 Flutter 官方已知问题（flutter 工具在构建失败时也会提示
          # 「Your project requires a newer version of the Kotlin Gradle plugin」）。
          # 升到 1.8.22 即可读取 1.8/1.9 元数据；AGP 与 Gradle 版本不动
          # （上一轮构建已验证 AGP 7.3.0 + Gradle 7.6.3 能通过配置期与原生编译）。
          sed -i \
            's/id "org.jetbrains.kotlin.android" version "1.7.10"/id "org.jetbrains.kotlin.android" version "1.8.22"/' \
            android/settings.gradle
          echo "  升级后的 Kotlin 插件声明："
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle | sed 's/^/    /'
          # 幂等校验：确认替换真的生效（模板版本若变化导致没命中，构建停下来暴露问题）
          if ! grep -q 'org.jetbrains.kotlin.android" version "1.8.22"' android/settings.gradle; then
            echo "  !! Kotlin 版本替换未生效（模板 Kotlin 声明可能已变化），请检查"
            exit 1
          fi

          echo ">>> 升级 Android Gradle Plugin（7.3.0 → 8.1.2）与 Gradle（7.6.3 → 8.3）"
          # 背景：:app:mergeExtDexRelease 阶段 D8 崩：
          #   ERROR: jetified-camera-video-1.4.1-runtime.jar: D8:
          #     java.lang.NullPointerException: Cannot invoke "String.length()"
          #     because "<parameter1>" is null
          #   ERROR: jetified-error_prone_annotations-2.36.0.jar: D8: 同上
          #   ERROR: jetified-camera-camera2-1.4.1-runtime.jar / camera-core-1.4.1: 同上
          #   Execution failed for task ':app:mergeExtDexRelease'.
          # 这是 D8/R8 的已知 bug：它假定方法的形参名永远不为 null，而 2024 年的
          # 构件里存在「无名形参」（新版 JDK 编译产物）。修复只 backport 到了
          # **AGP 8.0+**，AGP 7.x 任何版本都没有，因此只能升 AGP。
          # （已核实不是 jar 损坏：unzip -t 校验 android-34/35/36 全部 OK；
          #  也不是 class 文件版本过高：camera-core/classes.jar 全是 v52/Java 8）
          # AGP 8.1.2 要求 Gradle 8.0+，这里同步升到 8.3；JDK 17、Kotlin 1.8.22、
          # compileSdk 34 均满足 AGP 8.x 要求。
          sed -i 's/id "com.android.application" version "7.3.0" apply false/id "com.android.application" version "8.1.2" apply false/' \
            android/settings.gradle
          sed -i 's/gradle-7\.6\.3-all\.zip/gradle-8.3-all.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties
          echo "  升级后的 AGP 声明："
          grep -n "com.android.application" android/settings.gradle | sed 's/^/    /'
          echo "  升级后的 Gradle 分发："
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties | sed 's/^/    /'
          # 幂等校验：替换未命中就让构建立刻失败，避免静默跑旧版本
          if ! grep -q 'com.android.application" version "8.1.2"' android/settings.gradle; then
            echo "  !! AGP 升级未生效，请检查模板声明是否变化"
            exit 1
          fi
          if ! grep -q 'gradle-8.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties; then
            echo "  !! Gradle 升级未生效，请检查 wrapper 声明是否变化"
            exit 1
          fi

          echo ">>> 留存模板产物，便于核对 AGP / Kotlin 版本"
          cp android/settings.gradle      "${LOG_DIR}/03-template-settings.gradle"
          cp android/app/build.gradle     "${LOG_DIR}/04-template-app-build.gradle"
          cp android/gradle.properties    "${LOG_DIR}/05-template-gradle.properties"
          cp android/gradle/wrapper/gradle-wrapper.properties "${LOG_DIR}/06-gradle-wrapper.properties"
          echo ">>> 模板 app/build.gradle 内容："
          cat android/app/build.gradle

          echo ">>> 拷回自定义配置"
          cp /tmp/custom/android/app/build.gradle                   android/app/build.gradle
          cp /tmp/custom/android/app/proguard-rules.pro             android/app/proguard-rules.pro
          cp /tmp/custom/android/app/src/main/AndroidManifest.xml   android/app/src/main/AndroidManifest.xml
          cp /tmp/custom/android/app/src/debug/AndroidManifest.xml  android/app/src/debug/AndroidManifest.xml
          cp /tmp/custom/ios/Podfile                                ios/Podfile
          cp /tmp/custom/ios/Runner/Info.plist                      ios/Runner/Info.plist

          echo ">>> 校验关键文件是否齐全"
          for f in android/settings.gradle android/gradle.properties \
                   android/gradlew android/gradle/wrapper/gradle-wrapper.jar \
                   android/app/src/main/kotlin/com/dokalike/dokalike_camera/MainActivity.kt \
                   android/app/src/main/res/values/styles.xml ; do
            if [ -f "$f" ]; then echo "  OK   $f"; else echo "  MISS $f"; exit 1; fi
          done
          echo ">>> android/ 目录树（前两层）"
          find android -maxdepth 2 -not -path '*/.git*' | sort | head -n 60

      # 6) Flutter 环境自检
      - name: Flutter 环境自检
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter doctor -v 2>&1 | tee "${LOG_DIR}/07-flutter-doctor.log" || true

      # 7) 拉取 Dart 依赖
      - name: 拉取依赖
        id: pub_get
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter pub get 2>&1 | tee "${LOG_DIR}/08-pub-get.log"

      # 7.5) ★修补不兼容插件★
      #
      # 背景：pub-cache 里部分插件的 android/build.gradle 仍是旧式写法，
      # 在 Flutter 3.24 的新版 Android Gradle Plugin 体系下会在 **Gradle 配置期**
      # 直接崩溃，而不是等到编译阶段，因此必须在构建前就地打补丁：
      #   1) gal 2.3.3：写的是 `compileSdk flutter.compileSdkVersion`。
      #      `flutter` 这个 extension 不会自动注入到插件子工程，于是报
      #      "Could not get unknown property 'flutter' for extension 'android'"
      #      + "compileSdkVersion is not specified"。gal 最新版就是 2.3.3，
      #      无版本可升，只能打补丁。
      #   2) tflite_flutter 0.11.0：写死 `compileSdkVersion 31`，而 runner 上
      #      只装了 android-34 / android-35，轮到它编译时必然失败。
      #   3) flutter_plugin_android_lifecycle / google_mlkit_commons /
      #      google_mlkit_face_detection：写死 `compileSdk 35`（或 `compileSdk = 35`）。
      #      而 AGP 7.3.0 没有适配 Android 15（API 35）——compileSdk 35 时
      #      :app:processReleaseResources 会崩在 aapt2 读不懂 android-35 的
      #      资源表（显式 buildToolsVersion 35.0.0 也救不回来，见 run 36562623986）。
      #      因此这里统一把 35 拉回 34，与 app 的 compileSdk 34 对齐。
      # 所有 sed 规则都是幂等的（替换后再跑一次不会再命中）。
      - name: 修补不兼容插件
        continue-on-error: false
        run: |
          LOG="${LOG_DIR}/08b-plugin-patch.log"
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"

          patch_plugins() {
            echo "===== 插件 android/build.gradle 补丁 ====="
            echo "扫描目录 : ${PUB_CACHE_DIR}"
            echo "flutter  : $(flutter --version 2>/dev/null | head -n 1 || echo 'unknown')"
            echo ""

            if [ ! -d "${PUB_CACHE_DIR}" ]; then
              echo "!! pub-cache 目录不存在，无法打补丁"
              return 1
            fi

            scanned=0
            patched=0

            # 注意：这里用 for + glob，未命中时 $gradle 会是原样 pattern，
            # 下面用 [ -f ] 兜住并在日志里说明「没命中」。
            for gradle in "${PUB_CACHE_DIR}"/*/android/build.gradle; do
              if [ ! -f "$gradle" ]; then
                echo "[未命中] glob 没有匹配到任何插件 build.gradle：$gradle"
                continue
              fi
              scanned=$((scanned + 1))

              # 只挑出「需要修补」的行做快照：
              # flutter.compileSdkVersion / compileSdkVersion 31 / 任何写死的 35
              before=$(grep -n -E "compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*(flutter\.compileSdkVersion|31|35)([[:space:]]|$)" "$gradle" 2>/dev/null || true)
              if [ -z "$before" ]; then
                echo "[无需修补] $gradle"
                continue
              fi

              echo "[修补] $gradle"
              echo "  --- 替换前 ---"
              printf '%s\n' "$before" | sed 's/^/    /'

              # 幂等替换（GNU sed，runner 为 ubuntu-22.04）。
              # 统一目标 = 34，与 android/app/build.gradle 的 compileSdk 34 /
              # buildToolsVersion 34.0.0 对齐（AGP 7.3.0 原生支持的组合）：
              #   compileSdkVersion flutter.compileSdkVersion -> compileSdk 34
              #   compileSdk        flutter.compileSdkVersion -> compileSdk 34
              #   compileSdkVersion 31 / 35                   -> compileSdk 34
              #   compileSdk 35 / compileSdk = 35             -> compileSdk 34
              sed -i \
                -e 's/compileSdkVersion[[:space:]]\+flutter\.compileSdkVersion/compileSdk 34/g' \
                -e 's/compileSdk[[:space:]]\+flutter\.compileSdkVersion/compileSdk 34/g' \
                -e 's/compileSdkVersion[[:space:]]\+31\([[:space:]]\|$\)/compileSdk 34\1/g' \
                -e 's/compileSdkVersion[[:space:]]\+35\([[:space:]]\|$\)/compileSdk 34\1/g' \
                -e 's/compileSdk[[:space:]]*[[:space:]]\+35\([[:space:]]\|$\)/compileSdk 34\1/g' \
                -e 's/compileSdk[[:space:]]*=[[:space:]]*35\([[:space:]]\|$\)/compileSdk 34\1/g' \
                "$gradle"
              if [ $? -ne 0 ]; then
                echo "  !! sed 执行失败：$gradle"
                return 1
              fi

              after=$(grep -n -E "compileSdk" "$gradle" 2>/dev/null || true)
              echo "  --- 替换后 ---"
              printf '%s\n' "$after" | sed 's/^/    /'
              patched=$((patched + 1))
            done

            echo ""
            echo "扫描文件数 : ${scanned}"
            echo "修补文件数 : ${patched}"

            echo ""
            echo "===== 关键插件最终 compileSdk ====="
            for key in gal tflite_flutter flutter_plugin_android_lifecycle; do
              found=$(ls -1 ${PUB_CACHE_DIR}/${key}-*/android/build.gradle 2>/dev/null || true)
              if [ -z "$found" ]; then
                echo "  ${key}: 未安装（跳过）"
              else
                printf '%s\n' "$found" | while read -r f; do
                  line=$(grep -E "compileSdk" "$f" 2>/dev/null | tr -d ' ' | tr '\n' ';' || true)
                  echo "  ${key}: ${f} -> ${line}"
                done
              fi
            done

            echo ""
            echo "===== 插件自带 Kotlin 版本对齐（1.6.x / 1.7.x → 1.8.22） ====="
            # sensors_plus / share_plus 在自己的 buildscript 里写死了旧 Kotlin：
            #   ext.kotlin_version = '1.7.22'
            #   classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            # 于是这两个插件子工程用的是 Kotlin 1.7.x 编译器，而它们依赖的
            # androidx（core-ktx 1.13.1、fragment 1.7.1、lifecycle 2.7.0、
            # activity 1.8.1…）都是 Kotlin 1.8 编译的，元数据版本 1.8.0 高于
            # 1.7.x 能读的 1.6.0，编译期刷屏报错：
            #   "Module was compiled with an incompatible version of Kotlin.
            #    The binary version of its metadata is 1.8.0,
            #    expected version is 1.6.0"
            # 与主工程（已升到 1.8.22）对齐即可消除。classpath 里解析到的
            # kotlin-stdlib 本来就已经是 1.8.22，所以这里改的是编译器版本。
            kt_patched=0
            for gradle in "${PUB_CACHE_DIR}"/*/android/build.gradle; do
              if [ ! -f "$gradle" ]; then continue; fi
              before=$(grep -n -E "ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"]1\.[67]\.[0-9]+['\"]" \
                "$gradle" 2>/dev/null || true)
              if [ -z "$before" ]; then continue; fi
              echo "[Kotlin 对齐] $gradle"
              printf '%s\n' "$before" | sed 's/^/    替换前: /'
              sed -i -E "s/ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"]1\.[67]\.[0-9]+['\"]/ext.kotlin_version = '1.8.22'/g" \
                "$gradle"
              if [ $? -ne 0 ]; then
                echo "  !! Kotlin 版本 sed 执行失败：$gradle"
                return 1
              fi
              after=$(grep -n -E "ext\.kotlin_version" "$gradle" 2>/dev/null || true)
              printf '%s\n' "$after" | sed 's/^/    替换后: /'
              kt_patched=$((kt_patched + 1))
            done
            echo "对齐 Kotlin 版本的插件数 : ${kt_patched}"

            echo ""
            echo "===== 校验：是否还有未修补的旧写法 ====="
            remain=$(grep -rn -E "flutter\.compileSdkVersion|compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*(31|35)([[:space:]]|$)" \
              ${PUB_CACHE_DIR}/*/android/build.gradle 2>/dev/null || true)
            if [ -n "$remain" ]; then
              echo "!! 仍存在未修补的写法（目标应全部为 compileSdk 34）："
              printf '%s\n' "$remain"
              return 1
            fi
            echo "OK：插件 compileSdk 已全部对齐 34（无 flutter.compileSdkVersion / 31 / 35）"

            kt_remain=$(grep -rn -E "ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"]1\.[67]\.[0-9]+['\"]" \
              ${PUB_CACHE_DIR}/*/android/build.gradle 2>/dev/null || true)
            if [ -n "$kt_remain" ]; then
              echo "!! 仍存在旧的 ext.kotlin_version："
              printf '%s\n' "$kt_remain"
              return 1
            fi
            echo "OK：插件 ext.kotlin_version 已全部对齐 1.8.22"
            return 0
          }

          mkdir -p "${LOG_DIR}"
          patch_plugins > "${LOG}" 2>&1
          status=$?
          cat "${LOG}"
          echo "补丁步骤退出码 = ${status}"
          exit ${status}

      # 8) 静态分析（不阻塞构建，仅报告）
      - name: 静态分析（不阻塞）
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter analyze 2>&1 | tee "${LOG_DIR}/09-analyze.log" || true

      # 9) 运行单元测试（不阻塞 release 产出，失败仅告警）
      - name: 单元测试（不阻塞）
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter test 2>&1 | tee "${LOG_DIR}/10-test.log" || true

      # 9.5) 准备 AI 物体检测模型。
      #     模型是 ~4MB 二进制，不进仓库（见 assets/models/README.md），构建前现取。
      #     runner 网络不受限，可以直连 storage.googleapis.com；本机开发机若取不到，
      #     用仓库里的 scripts/fetch_model.sh 自行下载即可。
      #     下载失败不阻断构建：App 会自动降级为「仅人脸检测」，但日志里会明确记录。
      - name: 准备 AI 检测模型
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          {
            echo ">>> 下载 COCO SSD MobileNet V1 量化模型"
            bash scripts/fetch_model.sh
            echo ">>> assets/models 现状"
            ls -l assets/models || true
          } 2>&1 | tee "${LOG_DIR}/08c-model.log"

      # 10) 构建 Release APK。
      #     --split-per-abi 由 Flutter 插件自动完成 ABI 过滤与分包，产出 3 个 APK。
      #     注意：不要在 gradle 里手写 splits.abi，否则与插件注入的
      #     ndk.abiFilters 冲突（"Configuration conflict: ABI ..."）导致构建失败。
      - name: 构建 Release APK
        id: build_apk
        continue-on-error: true
        env:
          # 正式签名密钥（可选）。四个 Secrets 配齐即启用 release 签名；
          # 任意一个缺失，android/app/build.gradle 会自动回退 debug 签名，
          # 构建照常成功，只是产物不能上架应用商店。
          # 生成方式见 BUILD_GUIDE.md 第五节。密钥本身绝不入库。
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "${LOG_DIR}"
          if [ -n "${ANDROID_KEYSTORE_PATH}" ] && [ -n "${ANDROID_KEY_ALIAS}" ]; then
            echo ">>> 检测到签名密钥配置，启用 release 正式签名（alias=${ANDROID_KEY_ALIAS}）"
          else
            echo ">>> 未配置签名密钥，release 将回退 debug 签名（可安装自测，不可上架）"
          fi
          flutter build apk --release --split-per-abi 2>&1 | tee "${LOG_DIR}/11-build-apk.log"
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=${code}"
          exit $code

      # 10.2) ★ APK 交付前自检（交付门禁）★
      #
      # 为什么要有这一步：构建成功 ≠ 产物可用。「模型没打进包里」「原生库缺
      # 某个 ABI」这类问题只有装到真机上才会暴露，CI 与构建日志都是绿的。
      # 这里在交付前对着 build/app/outputs/flutter-apk/*.apk 做一次静态体检：
      #   1) aapt / aapt2 dump badging → 包名、versionCode/versionName、
      #      minSdk(sdkVersion)、targetSdkVersion、声明的 uses-permission
      #   2) unzip -l → 模型文件、标签表、TFLite 原生库是否真的进了包
      #   3) 每个 APK 的字节大小与人类可读大小
      #
      # 严重级别（重要，避免误判）：
      #   - 包内「必需条目」缺失            → 硬失败（交付门禁，必须暴露出来）
      #   - aapt / aapt2 / unzip 工具缺失   → 环境问题，打印 ⚠ 后跳过该项校验，
      #                                        绝不把环境问题算到产物头上
      #   - 包名/版本/sdk 版本等元数据      → 参考项，打印 ✓/✗ 提示但不阻断
      #                                       （aapt 与 aapt2 输出格式有差异，
      #                                        硬拦会误伤）
      #
      # 日志文件名 11b-apk-inspect.log：后续「导出日志到 ci-logs 分支」步骤
      # 是按 *.log 通配复制的，无需再登记文件名。
      - name: APK 交付前自检
        if: always()
        run: |
          LOG="${LOG_DIR}/11b-apk-inspect.log"
          mkdir -p "${LOG_DIR}"

          # 相等打印 ✓，不等打印 ✗（只影响日志可读性）
          mark() {
            if [ "$1" = "$2" ]; then echo "✓"; else echo "✗"; fi
          }

          run_inspect() {
            APK_DIR="build/app/outputs/flutter-apk"
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

            echo "===== APK 交付前自检 ====="
            echo "时间     : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "产物目录 : ${APK_DIR}"
            echo "SDK      : ${SDK:-（ANDROID_HOME / ANDROID_SDK_ROOT 均未设置）}"
            echo ""

            # ---------- 0) 工具探测：优先 aapt，退化 aapt2，都没有就警告跳过 ----------
            aapt_bin=""
            aapt_kind=""
            if [ -n "${SDK}" ]; then
              for c in $(ls -1 "${SDK}"/build-tools/*/aapt 2>/dev/null | sort -r); do
                if [ -x "$c" ]; then aapt_bin="$c"; aapt_kind="aapt"; break; fi
              done
              if [ -z "${aapt_bin}" ]; then
                for c in $(ls -1 "${SDK}"/build-tools/*/aapt2 2>/dev/null | sort -r); do
                  if [ -x "$c" ]; then aapt_bin="$c"; aapt_kind="aapt2"; break; fi
                done
              fi
            fi
            if [ -z "${aapt_bin}" ] && command -v aapt >/dev/null 2>&1; then
              aapt_bin="$(command -v aapt)"; aapt_kind="aapt"
            fi
            if [ -z "${aapt_bin}" ] && command -v aapt2 >/dev/null 2>&1; then
              aapt_bin="$(command -v aapt2)"; aapt_kind="aapt2"
            fi

            unzip_bin=""
            if command -v unzip >/dev/null 2>&1; then unzip_bin="$(command -v unzip)"; fi

            if [ -n "${aapt_bin}" ]; then
              echo "工具 aapt  : ${aapt_bin}（${aapt_kind}）"
            else
              echo "工具 aapt  : 未找到 —— 跳过 badging 解析（环境缺失，不判为产物问题）"
            fi
            if [ -n "${unzip_bin}" ]; then
              echo "工具 unzip : ${unzip_bin}"
            else
              echo "工具 unzip : 未找到 —— 跳过包内条目校验（环境缺失，不判为产物问题）"
            fi
            echo ""

            # ---------- 1) 收集产物 ----------
            if [ ! -d "${APK_DIR}" ]; then
              echo "✗ 产物目录不存在：${APK_DIR}"
              echo "  构建未产出任何 APK，请先看 11-build-apk.log 与 12-error-summary.log"
              return 1
            fi
            first_apk="$(ls -1 "${APK_DIR}"/*.apk 2>/dev/null | head -n 1 || true)"
            if [ -z "${first_apk}" ]; then
              echo "✗ ${APK_DIR} 下没有找到任何 .apk"
              return 1
            fi

            # 包内条目校验：命中则打印实际路径，未命中打印醒目 ✗ 并返回非 0。
            # 依赖外部变量 entries（当前 APK 的条目清单）。
            check_entry() {
              desc="$1"
              pattern="$2"
              hit="$(printf '%s\n' "${entries}" | grep -E "${pattern}" | head -n 1 || true)"
              if [ -n "${hit}" ]; then
                echo "    ✓ ${desc}"
                echo "        实际路径: ${hit}"
                return 0
              fi
              echo "    ✗ ${desc} —— 包内缺失！"
              return 1
            }

            count=0
            failed=0
            warned=0

            for apk in "${APK_DIR}"/*.apk; do
              [ -f "${apk}" ] || continue
              count=$((count + 1))
              fname="$(basename "${apk}")"
              echo "----------------------------------------"
              echo ">>> APK ${count}: ${fname}"

              # ---- 体积 ----
              bytes="$(stat -c '%s' "${apk}" 2>/dev/null || true)"
              if [ -z "${bytes}" ]; then bytes="$(wc -c < "${apk}" | tr -d ' ')"; fi
              human="$(awk -v b="${bytes}" 'BEGIN { printf "%.1f MB", b / 1048576 }')"
              echo "  大小: ${bytes} bytes（${human}）"

              # ---- ABI：从文件名 app-<abi>-release.apk 推断 ----
              abi="$(printf '%s' "${fname}" | sed -n 's/^app-\([A-Za-z0-9_-]\+\)-release\.apk$/\1/p')"
              if [ -z "${abi}" ]; then abi="unknown"; fi
              echo "  ABI : ${abi}"

              # ---------- 2) aapt / aapt2 dump badging ----------
              if [ -z "${aapt_bin}" ]; then
                warned=$((warned + 1))
              else
                badging="$("${aapt_bin}" dump badging "${apk}" 2>/dev/null || true)"
                if [ -z "${badging}" ]; then
                  echo "  ⚠ badging 无输出，跳过元数据解析"
                  warned=$((warned + 1))
                else
                  pkg_line="$(printf '%s\n' "${badging}" | grep -m1 '^package:' || true)"
                  # 注意：pkg_line 里还有 compileSdkVersionCodename='14'，
                  # 用 sed 的贪婪 .* 会把 name= 匹配到最后一个去（实测取到 14），
                  # 因此这里统一用 grep -o -m1 取「第一个」匹配项。
                  p_name="$(printf '%s' "${pkg_line}" | grep -o -m1 "name='[^']*'" | head -n 1 | sed "s/^name='//; s/'$//")"
                  p_code="$(printf '%s' "${pkg_line}" | grep -o -m1 "versionCode='[^']*'" | head -n 1 | sed "s/^versionCode='//; s/'$//")"
                  p_vname="$(printf '%s' "${pkg_line}" | grep -o -m1 "versionName='[^']*'" | head -n 1 | sed "s/^versionName='//; s/'$//")"
                  p_sdk="$(printf '%s\n' "${badging}" | grep -m1 '^sdkVersion:' | sed -n "s/.*'\([^']*\)'.*/\1/p" || true)"
                  p_target="$(printf '%s\n' "${badging}" | grep -m1 '^targetSdkVersion:' | sed -n "s/.*'\([^']*\)'.*/\1/p" || true)"
                  echo "  [badging] 参考项（期望 package=com.dokalike.dokalike_camera / versionCode=1 / versionName=1.0.0 / minSdk=23 / targetSdk=34）"
                  echo "    package           : ${p_name} $(mark "${p_name}" "com.dokalike.dokalike_camera")"
                  echo "    versionCode       : ${p_code} $(mark "${p_code}" "1")"
                  echo "    versionName       : ${p_vname} $(mark "${p_vname}" "1.0.0")"
                  echo "    sdkVersion(minSdk): ${p_sdk} $(mark "${p_sdk}" "23")"
                  echo "    targetSdkVersion  : ${p_target} $(mark "${p_target}" "34")"
                  echo "    uses-permission:"
                  perms="$(printf '%s\n' "${badging}" | grep -E '^uses-permission:' | sed -n "s/.*name='\([^']*\)'.*/\1/p" | sort || true)"
                  if [ -n "${perms}" ]; then
                    printf '%s\n' "${perms}" | sed 's/^/      - /'
                  else
                    echo "      （未解析到 uses-permission；aapt2 输出格式与 aapt 略有差异时会出现）"
                  fi
                fi
              fi

              # ---------- 3) unzip -l 包内条目校验 ----------
              if [ -z "${unzip_bin}" ]; then
                echo "  ⚠ unzip 不可用，跳过包内条目校验"
                warned=$((warned + 1))
                continue
              fi

              listing="$("${unzip_bin}" -l "${apk}" 2>/dev/null || true)"
              # unzip -l 行格式：<长度> <日期> <时间> <名称>。名称可能含空格，
              # 因此去掉前 3 个字段后把整行剩余部分作为条目名。
              entries="$(printf '%s\n' "${listing}" | awk 'NF>=4 && $1 ~ /^[0-9]+$/ { $1=""; $2=""; $3=""; sub(/^ +/, ""); print }')"
              echo "  包内条目数: $(printf '%s\n' "${entries}" | grep -c . || true)"

              echo "  必需条目校验（路径以包内实际输出为准）："
              ok=1
              # Flutter 会把 pubspec 声明的 assets 原样打进 assets/flutter_assets/
              # 下面；这里用「结尾匹配」而非写死前缀，前缀变化也不会误报，
              # 且日志会打印实际路径便于核对。
              check_entry "TFLite 检测模型 ssd_mobilenet_v1_quant.tflite" '(^|/)assets/models/ssd_mobilenet_v1_quant\.tflite$' || ok=0
              check_entry "标签表 labels.txt" '(^|/)assets/models/labels\.txt$' || ok=0

              abi_entries="$(printf '%s\n' "${entries}" | grep -E "^lib/${abi}/" || true)"
              if [ -z "${abi_entries}" ]; then
                echo "    ⚠ 包内没有 lib/${abi}/ 下的任何条目，跳过原生库校验"
                echo "      （上游未分发该 ABI 的原生库，属上游/环境问题，不计为产物缺陷）"
                warned=$((warned + 1))
              else
                check_entry "TFLite FFI 库 libtensorflowlite_c.so（${abi}）" "^lib/${abi}/libtensorflowlite_c\.so$" || ok=0
                # 注意 + 在 ERE 里是量词，必须转义，否则 libc++_shared 匹配不到
                check_entry "C++ 运行时 libc++_shared.so（${abi}）" "^lib/${abi}/libc\+\+_shared\.so$" || ok=0
                echo "    -- lib/${abi} 实际条目清单 --"
                printf '%s\n' "${abi_entries}" | sed 's/^/       /'
              fi

              if [ "${ok}" -ne 1 ]; then
                failed=$((failed + 1))
                echo "  ==> ${fname} 未通过必需条目校验"
              fi
            done

            echo ""
            echo "===== 自检汇总 ====="
            echo "APK 数量         : ${count}"
            echo "失败包数(硬门禁) : ${failed}"
            echo "警告项(环境/上游): ${warned}"
            if [ "${count}" -eq 0 ]; then
              echo "✗ 没有可校验的 APK"
              return 1
            fi
            if [ "${failed}" -gt 0 ]; then
              echo "✗ APK 交付前自检未通过：${failed} 个包缺少必需条目（见上方 ✗ 标记）"
              return 1
            fi
            echo "✓ APK 交付前自检通过：模型资源与原生库均已在包内"
            return 0
          }

          run_inspect > "${LOG}" 2>&1
          status=$?
          cat "${LOG}"
          echo "APK 交付前自检退出码 = ${status}"
          exit ${status}

      # 10.5) 失败时打印 Gradle 报错摘要，写进日志便于远程查看
      - name: 提取 Gradle 报错摘要
        if: always()
        continue-on-error: true
        run: |
          {
            echo "===== 构建步骤结果 ====="
            echo "pub_get   = ${{ steps.pub_get.outcome }}"
            echo "build_apk = ${{ steps.build_apk.outcome }}"
            echo ""
            echo "===== 11-build-apk.log 中的 Gradle 错误片段 ====="
            if [ -f "${LOG_DIR}/11-build-apk.log" ]; then
              grep -n -E "FAILURE:|What went wrong|Execution failed for task|Caused by|Could not determine|error:|Exception|已中止|失败" \
                "${LOG_DIR}/11-build-apk.log" || echo "(未匹配到常见错误关键字)"
              echo ""
              echo "===== build-apk.log 最后 80 行 ====="
              tail -n 80 "${LOG_DIR}/11-build-apk.log"
            else
              echo "(没有 11-build-apk.log，构建步骤未执行)"
            fi
          } 2>&1 | tee "${LOG_DIR}/12-error-summary.log" || true

      # 11) 无论成败都保留构建产物，便于排查失败原因
      - name: 上传构建目录（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-outputs
          path: build/app/outputs/
          retention-days: 7
          if-no-files-found: ignore

      # 11.5) ★ 把全部日志推送到独立的 ci-logs 分支 ★
      #       GitHub 的 Logs API 要求 admin 权限，匿名/CI 之外的手段读不到；
      #       推到一个孤儿分支后，日志公开可读，排错不再来回截图。
      - name: 导出日志到 ci-logs 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -e
          WORK=/tmp/ci-logs-push
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "${LOG_DIR}"/*.log "$WORK/" 2>/dev/null || true
          cp "${LOG_DIR}"/*.gradle "$WORK/" 2>/dev/null || true
          cp "${LOG_DIR}"/*.properties "$WORK/" 2>/dev/null || true
          cd "$WORK"
          echo "run_id: ${GITHUB_RUN_ID}" > run-info.txt
          echo "attempt: ${GITHUB_RUN_ATTEMPT}" >> run-info.txt
          echo "commit: ${GITHUB_SHA}" >> run-info.txt
          echo "created_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> run-info.txt
          git init -q -b ci-logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: 构建日志 run ${GITHUB_RUN_ID}/attempt ${GITHUB_RUN_ATTEMPT}"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs --force
          echo "日志已推送到 ci-logs 分支"

      # 11.6) 日志同时作为 artifact 保留
      - name: 上传 ci-logs 制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: ignore

      # 11.9) 构建失败则让 job 明确失败
      - name: 断言构建成功
        if: always()
        run: |
          if [ "${{ steps.build_apk.outcome }}" = "failure" ] || [ "${{ steps.pub_get.outcome }}" = "failure" ]; then
            echo "::error::构建失败，请查看 ci-logs 分支或 ci-logs 制品中的日志"
            exit 1
          fi
          echo "构建成功"

      # 12) 上传所有 APK 作为构建产物
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dokalike-camera-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # 13) 输出构建摘要
      - name: 构建摘要
        run: |
          echo "## DokaLike Camera APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print "- **"$NF"**  "$5}'
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装说明" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 artifact `dokalike-camera-apk`" >> $GITHUB_STEP_SUMMARY
          echo "2. 解压后选择对应架构的 APK（多数手机用 **app-arm64-v8a-release.apk**）" >> $GITHUB_STEP_SUMMARY
          echo "3. 手机开启「未知来源应用安装」后点击安装" >> $GITHUB_STEP_SUMMARY

name: 构建 Android APK

# 触发条件：推送到 main/master 分支、打 v* 开头的 tag、或手动触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# 需要写权限：构建日志会被推送到独立的 ci-logs 分支，便于远程排错
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'   # pubspec 要求 sdk>=3.3.0；3.24 稳定且兼容
  JAVA_VERSION: '17'           # build.gradle 要求 VERSION_17
  ORG: 'com.dokalike'
  PROJECT: 'dokalike_camera'
  LOG_DIR: 'ci-logs'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # 1) 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 环境诊断：把 Java / Android SDK / Gradle 环境写进日志，
      #    方便远程定位「SDK 版本缺失」「AGP 版本不匹配」一类问题。
      - name: 环境诊断
        run: |
          mkdir -p "${LOG_DIR}"
          {
            echo "===== RUN INFO ====="
            echo "repository : ${GITHUB_REPOSITORY}"
            echo "run_id     : ${GITHUB_RUN_ID}"
            echo "attempt    : ${GITHUB_RUN_ATTEMPT}"
            echo "commit     : ${GITHUB_SHA}"
            echo "ref        : ${GITHUB_REF}"
            echo "===== JAVA ====="
            java -version 2>&1 || true
            echo "===== ANDROID SDK ====="
            echo "ANDROID_HOME     = $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "SDK dir          = $SDK"
            echo "-- installed platforms --"
            ls -1 "$SDK/platforms" 2>/dev/null || echo "(platforms 目录不存在)"
            echo "-- installed build-tools --"
            ls -1 "$SDK/build-tools" 2>/dev/null || echo "(build-tools 目录不存在)"
            echo "===== 磁盘空间 ====="
            df -h / | tail -n 1 || true
          } 2>&1 | tee "${LOG_DIR}/01-env.log"

      # 3) 安装 JDK 17（Gradle 8 + Android Gradle Plugin 8 要求）
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 4) 安装 Flutter SDK
      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 4.5) 补齐可能缺失的 Android SDK 平台。
      #      部分插件（如 google_mlkit_face_detection）声明了 compileSdk 35，
      #      若 runner 上没装对应的 SDK Platform，Gradle 配置阶段会直接失败。
      - name: 补齐 Android SDK 平台
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          {
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "SDK dir = $SDK"
            if command -v sdkmanager >/dev/null 2>&1; then
              yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
              yes 2>/dev/null | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
              yes 2>/dev/null | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
            else
              echo "sdkmanager 不在 PATH 中，跳过"
            fi
            echo "-- 补齐后的 platforms --"
            ls -1 "$SDK/platforms" 2>/dev/null || true
            echo "-- 补齐后的 build-tools --"
            ls -1 "$SDK/build-tools" 2>/dev/null || true
          } 2>&1 | tee "${LOG_DIR}/02-sdk.log"

      # 5) ★关键★ 重建完整平台脚手架
      #
      # 背景：本仓库只提交了「自定义过的」平台配置（build.gradle /
      # AndroidManifest / proguard-rules / Podfile / Info.plist），
      # 未提交 flutter create 生成的脚手架（MainActivity.kt、Gradle wrapper、
      # settings.gradle、res 资源、xcodeproj 等）。
      #
      # 问题：flutter create 一旦检测到 android/ 目录已存在，就认为该平台
      # 「已配置」而**跳过整个 Android 模板拷贝**，导致上述脚手架永远缺失
      # → Gradle 找不到 settings.gradle / MainActivity → 构建失败。
      #
      # 解法：备份自定义配置 → 删除 android/ ios/ → 让 flutter create
      # 完整生成脚手架 → 再把自定义配置拷回去覆盖。
      - name: 重建平台脚手架
        run: |
          set -e
          mkdir -p "${LOG_DIR}"
          echo ">>> 备份自定义平台配置"
          mkdir -p /tmp/custom/android/app/src/main /tmp/custom/android/app/src/debug /tmp/custom/ios/Runner
          cp android/app/build.gradle                   /tmp/custom/android/app/build.gradle
          cp android/app/proguard-rules.pro             /tmp/custom/android/app/proguard-rules.pro
          cp android/app/src/main/AndroidManifest.xml   /tmp/custom/android/app/src/main/AndroidManifest.xml
          cp android/app/src/debug/AndroidManifest.xml  /tmp/custom/android/app/src/debug/AndroidManifest.xml
          cp ios/Podfile                                /tmp/custom/ios/Podfile
          cp ios/Runner/Info.plist                      /tmp/custom/ios/Runner/Info.plist

          echo ">>> 删除不完整的平台目录（让 flutter create 完整生成）"
          rm -rf android ios

          echo ">>> 生成完整脚手架"
          flutter create \
            --org "${ORG}" \
            --project-name "${PROJECT}" \
            --android-language kotlin \
            --ios-language swift \
            --platforms android,ios \
            .

          echo ">>> 清理由 flutter create 重新生成的模板残留"
          # flutter create 会补齐所有「模板里有、仓库里没有」的文件，其中就包括
          # 模板自带的 test/widget_test.dart —— 它引用模板计数器 App 的 MyApp
          # 组件，本项目里根本不存在，于是 analyze 报 creation_with_non_type、
          # flutter test 报 Failed to load，白白占用报错面板、掩盖真实问题。
          # 本项目有自己的 test/ 套件，这个文件没有任何价值，直接删掉。
          # （本地仓库并未跟踪该文件，所以只能在这里删；删了以后下次构建
          #   flutter create 还会再生成，因此每次都删。）
          if [ -f test/widget_test.dart ]; then
            grep -n "MyApp" test/widget_test.dart >/dev/null 2>&1 && echo "  删除模板残留 test/widget_test.dart（引用了 MyApp）" || echo "  删除 test/widget_test.dart"
            rm -f test/widget_test.dart
          else
            echo "  未发现 test/widget_test.dart，无需清理"
          fi

          echo ">>> 留存模板产物，便于核对 AGP / Kotlin 版本"
          cp android/settings.gradle      "${LOG_DIR}/03-template-settings.gradle"
          cp android/app/build.gradle     "${LOG_DIR}/04-template-app-build.gradle"
          cp android/gradle.properties    "${LOG_DIR}/05-template-gradle.properties"
          cp android/gradle/wrapper/gradle-wrapper.properties "${LOG_DIR}/06-gradle-wrapper.properties"
          echo ">>> 模板 app/build.gradle 内容："
          cat android/app/build.gradle

          echo ">>> 拷回自定义配置"
          cp /tmp/custom/android/app/build.gradle                   android/app/build.gradle
          cp /tmp/custom/android/app/proguard-rules.pro             android/app/proguard-rules.pro
          cp /tmp/custom/android/app/src/main/AndroidManifest.xml   android/app/src/main/AndroidManifest.xml
          cp /tmp/custom/android/app/src/debug/AndroidManifest.xml  android/app/src/debug/AndroidManifest.xml
          cp /tmp/custom/ios/Podfile                                ios/Podfile
          cp /tmp/custom/ios/Runner/Info.plist                      ios/Runner/Info.plist

          echo ">>> 校验关键文件是否齐全"
          for f in android/settings.gradle android/gradle.properties \
                   android/gradlew android/gradle/wrapper/gradle-wrapper.jar \
                   android/app/src/main/kotlin/com/dokalike/dokalike_camera/MainActivity.kt \
                   android/app/src/main/res/values/styles.xml ; do
            if [ -f "$f" ]; then echo "  OK   $f"; else echo "  MISS $f"; exit 1; fi
          done
          echo ">>> android/ 目录树（前两层）"
          find android -maxdepth 2 -not -path '*/.git*' | sort | head -n 60

      # 6) Flutter 环境自检
      - name: Flutter 环境自检
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter doctor -v 2>&1 | tee "${LOG_DIR}/07-flutter-doctor.log" || true

      # 7) 拉取 Dart 依赖
      - name: 拉取依赖
        id: pub_get
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter pub get 2>&1 | tee "${LOG_DIR}/08-pub-get.log"

      # 7.5) ★修补不兼容插件★
      #
      # 背景：pub-cache 里部分插件的 android/build.gradle 仍是旧式写法，
      # 在 Flutter 3.24 的新版 Android Gradle Plugin 体系下会在 **Gradle 配置期**
      # 直接崩溃，而不是等到编译阶段，因此必须在构建前就地打补丁：
      #   1) gal 2.3.3：写的是 `compileSdk flutter.compileSdkVersion`。
      #      `flutter` 这个 extension 不会自动注入到插件子工程，于是报
      #      "Could not get unknown property 'flutter' for extension 'android'"
      #      + "compileSdkVersion is not specified"。gal 最新版就是 2.3.3，
      #      无版本可升，只能打补丁。
      #   2) tflite_flutter 0.11.0：写死 `compileSdkVersion 31`，而 runner 上
      #      只装了 android-34 / android-35，轮到它编译时必然失败。
      # 三条 sed 规则都是幂等的（替换后再跑一次不会再命中）。
      - name: 修补不兼容插件
        continue-on-error: false
        run: |
          LOG="${LOG_DIR}/08b-plugin-patch.log"
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"

          patch_plugins() {
            echo "===== 插件 android/build.gradle 补丁 ====="
            echo "扫描目录 : ${PUB_CACHE_DIR}"
            echo "flutter  : $(flutter --version 2>/dev/null | head -n 1 || echo 'unknown')"
            echo ""

            if [ ! -d "${PUB_CACHE_DIR}" ]; then
              echo "!! pub-cache 目录不存在，无法打补丁"
              return 1
            fi

            scanned=0
            patched=0

            # 注意：这里用 for + glob，未命中时 $gradle 会是原样 pattern，
            # 下面用 [ -f ] 兜住并在日志里说明「没命中」。
            for gradle in "${PUB_CACHE_DIR}"/*/android/build.gradle; do
              if [ ! -f "$gradle" ]; then
                echo "[未命中] glob 没有匹配到任何插件 build.gradle：$gradle"
                continue
              fi
              scanned=$((scanned + 1))

              # 只挑出「需要修补」的行做快照（flutter.compileSdkVersion 或 compileSdkVersion 31）
              before=$(grep -n -E "compileSdk(Version)?[[:space:]]+(flutter\.compileSdkVersion|31)([[:space:]]|$)" "$gradle" 2>/dev/null || true)
              if [ -z "$before" ]; then
                echo "[无需修补] $gradle"
                continue
              fi

              echo "[修补] $gradle"
              echo "  --- 替换前 ---"
              printf '%s\n' "$before" | sed 's/^/    /'

              # 幂等替换（GNU sed，runner 为 ubuntu-22.04）：
              #   compileSdkVersion flutter.compileSdkVersion -> compileSdk 35
              #   compileSdk        flutter.compileSdkVersion -> compileSdk 35
              #   compileSdkVersion 31                        -> compileSdk 35
              sed -i \
                -e 's/compileSdkVersion[[:space:]]\+flutter\.compileSdkVersion/compileSdk 35/g' \
                -e 's/compileSdk[[:space:]]\+flutter\.compileSdkVersion/compileSdk 35/g' \
                -e 's/compileSdkVersion[[:space:]]\+31\([[:space:]]\|$\)/compileSdk 35\1/g' \
                "$gradle"
              if [ $? -ne 0 ]; then
                echo "  !! sed 执行失败：$gradle"
                return 1
              fi

              after=$(grep -n -E "compileSdk" "$gradle" 2>/dev/null || true)
              echo "  --- 替换后 ---"
              printf '%s\n' "$after" | sed 's/^/    /'
              patched=$((patched + 1))
            done

            echo ""
            echo "扫描文件数 : ${scanned}"
            echo "修补文件数 : ${patched}"

            echo ""
            echo "===== 关键插件最终 compileSdk ====="
            for key in gal tflite_flutter flutter_plugin_android_lifecycle; do
              found=$(ls -1 ${PUB_CACHE_DIR}/${key}-*/android/build.gradle 2>/dev/null || true)
              if [ -z "$found" ]; then
                echo "  ${key}: 未安装（跳过）"
              else
                printf '%s\n' "$found" | while read -r f; do
                  line=$(grep -E "compileSdk" "$f" 2>/dev/null | tr -d ' ' | tr '\n' ';' || true)
                  echo "  ${key}: ${f} -> ${line}"
                done
              fi
            done

            echo ""
            echo "===== 校验：是否还有未修补的旧写法 ====="
            remain=$(grep -rn -E "flutter\.compileSdkVersion|compileSdkVersion[[:space:]]+31([[:space:]]|$)" \
              ${PUB_CACHE_DIR}/*/android/build.gradle 2>/dev/null || true)
            if [ -n "$remain" ]; then
              echo "!! 仍存在未修补的写法："
              printf '%s\n' "$remain"
              return 1
            fi
            echo "OK：已无 flutter.compileSdkVersion / compileSdkVersion 31"
            return 0
          }

          mkdir -p "${LOG_DIR}"
          patch_plugins > "${LOG}" 2>&1
          status=$?
          cat "${LOG}"
          echo "补丁步骤退出码 = ${status}"
          exit ${status}

      # 8) 静态分析（不阻塞构建，仅报告）
      - name: 静态分析（不阻塞）
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter analyze 2>&1 | tee "${LOG_DIR}/09-analyze.log" || true

      # 9) 运行单元测试（不阻塞 release 产出，失败仅告警）
      - name: 单元测试（不阻塞）
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter test 2>&1 | tee "${LOG_DIR}/10-test.log" || true

      # 10) 构建 Release APK。
      #     --split-per-abi 由 Flutter 插件自动完成 ABI 过滤与分包，产出 3 个 APK。
      #     注意：不要在 gradle 里手写 splits.abi，否则与插件注入的
      #     ndk.abiFilters 冲突（"Configuration conflict: ABI ..."）导致构建失败。
      - name: 构建 Release APK
        id: build_apk
        continue-on-error: true
        run: |
          mkdir -p "${LOG_DIR}"
          flutter build apk --release --split-per-abi 2>&1 | tee "${LOG_DIR}/11-build-apk.log"
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=${code}"
          exit $code

      # 10.5) 失败时打印 Gradle 报错摘要，写进日志便于远程查看
      - name: 提取 Gradle 报错摘要
        if: always()
        continue-on-error: true
        run: |
          {
            echo "===== 构建步骤结果 ====="
            echo "pub_get   = ${{ steps.pub_get.outcome }}"
            echo "build_apk = ${{ steps.build_apk.outcome }}"
            echo ""
            echo "===== 11-build-apk.log 中的 Gradle 错误片段 ====="
            if [ -f "${LOG_DIR}/11-build-apk.log" ]; then
              grep -n -E "FAILURE:|What went wrong|Execution failed for task|Caused by|Could not determine|error:|Exception|已中止|失败" \
                "${LOG_DIR}/11-build-apk.log" || echo "(未匹配到常见错误关键字)"
              echo ""
              echo "===== build-apk.log 最后 80 行 ====="
              tail -n 80 "${LOG_DIR}/11-build-apk.log"
            else
              echo "(没有 11-build-apk.log，构建步骤未执行)"
            fi
          } 2>&1 | tee "${LOG_DIR}/12-error-summary.log" || true

      # 11) 无论成败都保留构建产物，便于排查失败原因
      - name: 上传构建目录（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-outputs
          path: build/app/outputs/
          retention-days: 7
          if-no-files-found: ignore

      # 11.5) ★ 把全部日志推送到独立的 ci-logs 分支 ★
      #       GitHub 的 Logs API 要求 admin 权限，匿名/CI 之外的手段读不到；
      #       推到一个孤儿分支后，日志公开可读，排错不再来回截图。
      - name: 导出日志到 ci-logs 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -e
          WORK=/tmp/ci-logs-push
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "${LOG_DIR}"/*.log "$WORK/" 2>/dev/null || true
          cp "${LOG_DIR}"/*.gradle "$WORK/" 2>/dev/null || true
          cp "${LOG_DIR}"/*.properties "$WORK/" 2>/dev/null || true
          cd "$WORK"
          echo "run_id: ${GITHUB_RUN_ID}" > run-info.txt
          echo "attempt: ${GITHUB_RUN_ATTEMPT}" >> run-info.txt
          echo "commit: ${GITHUB_SHA}" >> run-info.txt
          echo "created_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> run-info.txt
          git init -q -b ci-logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: 构建日志 run ${GITHUB_RUN_ID}/attempt ${GITHUB_RUN_ATTEMPT}"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs --force
          echo "日志已推送到 ci-logs 分支"

      # 11.6) 日志同时作为 artifact 保留
      - name: 上传 ci-logs 制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: ignore

      # 11.9) 构建失败则让 job 明确失败
      - name: 断言构建成功
        if: always()
        run: |
          if [ "${{ steps.build_apk.outcome }}" = "failure" ] || [ "${{ steps.pub_get.outcome }}" = "failure" ]; then
            echo "::error::构建失败，请查看 ci-logs 分支或 ci-logs 制品中的日志"
            exit 1
          fi
          echo "构建成功"

      # 12) 上传所有 APK 作为构建产物
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dokalike-camera-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # 13) 输出构建摘要
      - name: 构建摘要
        run: |
          echo "## DokaLike Camera APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print "- **"$NF"**  "$5}'
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装说明" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 artifact `dokalike-camera-apk`" >> $GITHUB_STEP_SUMMARY
          echo "2. 解压后选择对应架构的 APK（多数手机用 **app-arm64-v8a-release.apk**）" >> $GITHUB_STEP_SUMMARY
          echo "3. 手机开启「未知来源应用安装」后点击安装" >> $GITHUB_STEP_SUMMARY

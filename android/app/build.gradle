// DokaLike Camera Android 应用级构建脚本
// 关键约定：
//  1. minSdk 23（tflite_flutter FFI 库要求）
//  2. aaptOptions noCompress "tflite"（模型文件不可压缩，否则无法 mmap 加载）
//  3. split-per-abi 控制单包体积（P0-11：包体积 ≤150MB）
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // namespace 与 applicationId 对齐 flutter create --org com.dokalike 生成的
    // MainActivity 包路径（com/dokalike/dokalike_camera），避免 CI 构建时
    // 找不到 MainActivity。显示名仍由 AndroidManifest.label 控制。
    namespace "com.dokalike.dokalike_camera"
    // compileSdk 回到 34：AGP 7.3.0（2022 年发布）根本没有为 Android 15
    // （API 35）做过适配，compileSdk 35 时 :app:processReleaseResources 会崩在
    //   aapt2 E LoadedArsc.cpp:94] RES_TABLE_TYPE_TYPE entry offsets
    //           overlap actual entry data.
    //   aapt2 E ApkAssets.cpp:149] Failed to load resources table in APK
    //           '.../platforms/android-35/android.jar'.
    // 显式 buildToolsVersion 35.0.0 也没能救回来（见 run 36562623986），
    // 所以改为「平台 + 构建工具 + 插件」三者统一降到 34 —— 这是 AGP 7.3.0
    // 原生支持的组合（34 正是它同期的主流 API 级别），build-tools 34.0.0
    // 在 runner 上是预装的。插件里硬编码 compileSdk 35 的三个
    // （flutter_plugin_android_lifecycle / google_mlkit_commons /
    // google_mlkit_face_detection）由 CI 的插件补丁步骤统一 sed 成 34。
    // ⚠️ targetSdk 保持 34 不变——升到 35 会触发 Android 15 强制
    // edge-to-edge（内容延伸到状态栏/导航栏下方），现有 UI 尚未适配。
    compileSdk 34
    // ⚠️ 必须显式指定：AGP 7.3.0 的默认 buildToolsVersion 是 30.0.3（2020 年的
    // aapt2），runner 上没装、Gradle 会当场联网下载，而它解析不了 android-34
    // 的资源表。钉 34.0.0（预装）与 compileSdk 34 同源。
    buildToolsVersion "34.0.0"
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.dokalike.dokalike_camera"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        // ⚠️ 不要在这里写 ndk { abiFilters ... }。
        // AGP 禁止 ndk.abiFilters 与 splits.abi 声明相同的 ABI，否则报：
        //   "Configuration conflict: ABI '...' in ndk abi cannot appear in ABI splits"
        // 下面的 splits.abi 本身就会完成 ABI 过滤与分包，无需重复声明。
    }

    // 模型资源不压缩：tflite 需要直接内存映射加载
    aaptOptions {
        noCompress "tflite"
    }

    // tflite_flutter 与 ML Kit 都会携带 libc++_shared.so，
    // 不指定 pickFirst 会在 mergeReleaseNativeLibs 阶段报
    // "2 files found with path 'lib/*/libc++_shared.so'" 而构建失败。
    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        // tflite 模型随 assets 打包，避免与插件自带的模型文件冲突
        pickFirst 'assets/**/*.tflite'
    }

    // ⚠️ 不要在 gradle 里配置 splits.abi！
    // Flutter Gradle 插件在 `flutter build apk --split-per-abi` 时会自行
    // 注入 ndk.abiFilters 与 ABI 拆分逻辑；若此处再手写 splits.abi，
    // 两者的 ABI 集合相同即触发 AGP 冲突：
    //   "Configuration conflict: ABI '...' in ndk abi cannot appear in ABI splits"
    // 拆分由 workflow 中的 `flutter build apk --release --split-per-abi` 完成。

    // ---- Release 签名（可选，缺省自动回退 debug 签名）----
    //
    // 设计原则：**没有密钥也一定能构建成功**。
    // 密钥绝不入库（.gitignore 已忽略 *.keystore / *.jks / key.properties），
    // 因此这里按两级优先级读取，读不到就回退到 debug 签名：
    //   ① android/key.properties（本地开发，key.properties 已 gitignore）
    //        storeFile=/abs/path/to/upload-keystore.jks
    //        storePassword=***
    //        keyAlias=upload
    //        keyPassword=***
    //   ② 环境变量（CI / GitHub Secrets，见 BUILD_GUIDE.md 第五节）
    //        ANDROID_KEYSTORE_PATH      同 storeFile
    //        ANDROID_KEYSTORE_PASSWORD  同 storePassword
    //        ANDROID_KEY_ALIAS          同 keyAlias
    //        ANDROID_KEY_PASSWORD       同 keyPassword
    // 四项缺一即视为「未配置」，走 debug 签名。
    //
    // ⚠️ 不要自定义 signingConfigs.debug。
    // AGP 会自动创建 debug signingConfig 并指向 ~/.android/debug.keystore
    // （不存在时自动生成一个）。此前这里写了 storeFile file('debug.keystore')，
    // 但仓库里并没有该文件，导致 Gradle 在签名阶段直接失败。
    def keystorePropsFile = rootProject.file("key.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    // 环境变量优先于 key.properties，方便 CI 用 Secrets 覆盖本地配置
    def pick = { String envKey, String propKey ->
        def v = System.getenv(envKey)
        if (v == null || v.trim().isEmpty()) {
            v = keystoreProps.getProperty(propKey)
        }
        return (v == null || v.trim().isEmpty()) ? null : v.trim()
    }
    def ksPath = pick("ANDROID_KEYSTORE_PATH", "storeFile")
    def ksStorePassword = pick("ANDROID_KEYSTORE_PASSWORD", "storePassword")
    def ksAlias = pick("ANDROID_KEY_ALIAS", "keyAlias")
    def ksKeyPassword = pick("ANDROID_KEY_PASSWORD", "keyPassword")
    def useReleaseSigning = ksPath != null && ksStorePassword != null &&
            ksAlias != null && ksKeyPassword != null

    // 打印一次签名策略，方便在 CI 日志里一眼确认用的是哪把钥匙
    // （V1/V2 由 AGP 按 minSdk 自动决定：minSdk 23 < 24，两者都会启用，无需手配）
    if (useReleaseSigning) {
        println "[signing] release 使用正式签名：${ksPath} (alias=${ksAlias})"
    } else {
        println "[signing] release 未配置正式密钥，回退 debug 签名（仅供自测，不可上架）"
    }

    signingConfigs {
        // 仅在密钥齐全时才创建 release 配置：否则会留下一个 storeFile 为空的
        // 签名配置，AGP 校验阶段可能报 "Keystore file not set for signing
        // config 'release'"。不创建就不会被任何 variant 引用。
        if (useReleaseSigning) {
            release {
                storeFile = file(ksPath)
                storePassword = ksStorePassword
                keyAlias = ksAlias
                keyPassword = ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // 先关闭 R8 / 资源收缩，确保能稳定产出可安装 APK。
            // R8 在 tflite_flutter + ML Kit 场景容易因反射/FFI 符号被裁掉而失败，
            // 待基础构建跑通后再单独开启并补充 proguard-rules.pro 验证。
            minifyEnabled false
            shrinkResources false
            // 有正式密钥则用 release 签名；否则回退 debug 签名（仍可安装运行，
            // 只是不能上架应用商店）。
            signingConfig = useReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
